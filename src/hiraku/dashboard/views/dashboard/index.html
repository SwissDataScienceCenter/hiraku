<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiraku records</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #20252b; background: #fff; font: 15px/1.6 system-ui, sans-serif; }
    #app-shell { display: grid; grid-template-columns: minmax(280px, 32%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(340px, 42%); height: 100vh; }
    nav { grid-row: 1 / 3; border-right: 1px solid #e5e7eb; }
    nav, article, section { padding: 24px; overflow: auto; min-width: 0; }
    section { border-top: 1px solid #e5e7eb; }
    marimo-cell { display: block; --marimo-output-max-height: none; }
    .front-matter { padding: 12px; background: #f5f5f4; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main id="app-shell">
    <nav aria-label="Records"><marimo-cell name="record_tree"></marimo-cell></nav>
    <article aria-label="Selected record"><marimo-cell name="record_details"></marimo-cell></article>
    <section aria-label="Tracked runs">
      <marimo-cell name="metric_control"></marimo-cell>
      <marimo-cell name="run_plot"></marimo-cell>
    </section>
  </main>
</body>
</html>
