<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runs · Hiraku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./ui.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="app-shell">
      <header class="topbar">
        <marimo-cell name="header"></marimo-cell>
        <marimo-cell name="refresh_button"></marimo-cell>
      </header>
      <p class="eyebrow">Experiment workspace</p>
      <h1>Inspect runs</h1>
      <p class="intro">Explore records, select a run, and review its provenance and metric history.</p>
      <section class="card">
        <h2>Records and runs</h2>
        <marimo-cell name="tree_heading"></marimo-cell>
        <marimo-cell name="tree_section"></marimo-cell>
      </section>
      <div class="workspace">
        <section class="card">
          <h2>Selected run</h2>
          <marimo-cell name="run_heading"></marimo-cell>
          <marimo-cell name="run_section"></marimo-cell>
        </section>
        <section class="card">
          <h2>Metric analysis</h2>
          <marimo-cell name="plot_heading"></marimo-cell>
          <marimo-cell name="plot_section"></marimo-cell>
        </section>
      </div>
      <marimo-cell name="footer"></marimo-cell>
    </main>
    <script>
      (() => {
        const header = document.querySelector(".topbar");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        let previousY = window.scrollY;
        let pending = false;
        window.addEventListener("scroll", () => {
          if (pending || reducedMotion.matches) return;
          pending = true;
          requestAnimationFrame(() => {
            const currentY = window.scrollY;
            header.classList.toggle("is-hidden", currentY > 80 && currentY > previousY);
            previousY = currentY;
            pending = false;
          });
        }, { passive: true });
      })();
    </script>
  </body>
</html>
