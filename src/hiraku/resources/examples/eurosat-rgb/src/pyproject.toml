[project]
name = "hiraku-eurosat-rgb-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "torchvision>=0.17", "wandb>=0.17"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
