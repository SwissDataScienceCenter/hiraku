<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runs · Hiraku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./ui.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components.css" crossorigin="anonymous">
    <script src="./layout.js" defer></script>
  </head>
  <body>
    <main id="app-shell">
      <header class="topbar">
        <div class="hk-header-inner">
          <img class="hk-brand-logo hk-logo-light" src="assets/sdsc-logo.svg" alt="Swiss Data Science Center">
          <img class="hk-brand-logo hk-logo-dark" src="assets/sdsc-logo-white.svg" alt="Swiss Data Science Center">
          <div>
            <h2 class="hk-brand-title">Hiraku dashboard</h2>
            <div class="hk-brand-subtitle">Research records and tracked runs · <marimo-cell name="project_name"></marimo-cell></div>
          </div>
        </div>
        <marimo-cell name="refresh_control"></marimo-cell>
      </header>
      <nav class="workspace-tabs" role="tablist" aria-label="Dashboard views">
        <button type="button" role="tab" id="experiment-tab" aria-controls="experiment-panel" aria-selected="true">Experiment Workspace</button>
        <button type="button" role="tab" id="workflows-tab" aria-controls="workflows-panel" aria-selected="false" tabindex="-1">Workflows</button>
      </nav>
      <section id="experiment-panel" role="tabpanel" aria-labelledby="experiment-tab">
      <h1>Inspect runs</h1>
      <p class="intro">Explore records, select a run, and review its provenance and metric history.</p>
      <div class="dashboard-layout">
      <aside id="record-sidebar" class="card record-navigation" aria-label="Record navigation">
        <marimo-cell name="record_navigation"></marimo-cell>
      </aside>
      <div class="dashboard-divider" role="separator" tabindex="0"
        aria-label="Resize record sidebar" aria-orientation="vertical"
        aria-controls="record-sidebar" title="Drag to resize; arrow keys adjust; double-click resets"></div>
      <div class="dashboard-content">
      <section class="card">
        <h2>Records and runs</h2>
        <marimo-cell name="run_table"></marimo-cell>
      </section>
      <section class="card record-details">
        <h2>Record</h2>
        <marimo-cell name="record_details"></marimo-cell>
      </section>
      <section class="card run-details">
        <h2>Selected run</h2>
        <marimo-cell name="run_details"></marimo-cell>
      </section>
      <div class="workspace">
        <section class="card">
          <h2>Performance over runs</h2>
          <marimo-cell name="performance_plot"></marimo-cell>
        </section>
        <section class="card">
          <h2>Metric trade-offs</h2>
          <marimo-cell name="tradeoff_plot"></marimo-cell>
        </section>
      </div>
      </div>
      </div>
      </section>
      <section id="workflows-panel" role="tabpanel" aria-labelledby="workflows-tab" hidden>
        <div class="card">
          <marimo-cell name="workflow_selection"></marimo-cell>
          <marimo-cell name="workflow_details"></marimo-cell>
        </div>
      </section>
      <footer class="hk-footer">
        <img src="assets/sdsc-logo-white.svg" alt="Swiss Data Science Center">
        <p class="hk-footer-label">Swiss Data Science Center</p>
      </footer>
    </main>
    <script>
      (() => {
        const header = document.querySelector(".topbar");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        let previousY = window.scrollY;
        let pending = false;
        window.addEventListener("scroll", () => {
          if (pending || reducedMotion.matches) return;
          pending = true;
          requestAnimationFrame(() => {
            const currentY = window.scrollY;
            header.classList.toggle("is-hidden", currentY > 80 && currentY > previousY);
            previousY = currentY;
            pending = false;
          });
        }, { passive: true });
      })();
    </script>
  </body>
</html>
