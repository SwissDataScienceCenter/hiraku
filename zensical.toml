[project]
site_url = "https://swissdatasciencecenter.github.io/hiraku/"
site_name = "Hiraku"
site_description = "Core metadata and launch APIs for AI-assisted data science"
site_author = "Hiraku contributors"
repo_url = "https://github.com/SwissDataScienceCenter/hiraku"
repo_name = "SwissDataScienceCenter/hiraku"
plugins = [
  "search",
  { "mkdocstrings" = { "handlers" = { "python" = { "options" = {
    "docstring_style" = "google",
    "members_order" = "alphabetical",
    "show_source" = false,
    "filters" = ["!^_"],
  } } } } },
]

nav = [
  { "Get started" = "index.md" },
  { "Installation" = "install.md" },
  { "Core concepts" = "core.md" },
  { "CLI reference" = "cli.md" },
  { "Tracking" = "tracking.md" },
  { "Examples" = "examples.md" },
  { "Design" = "design.md" },
  { "Python API" = [
      { "Overview" = "api/index.md" },
      { "Configuration" = "api/config.md" },
      { "Records" = "api/records.md" },
      { "Data models" = [
          { "Task" = "api/task.md" },
          { "Experiment" = "api/experiment.md" },
          { "Run" = "api/run.md" },
          { "Metric" = "api/metric.md" },
          { "Entrypoint" = "api/entrypoint.md" },
      ] },
      { "Tracking" = "api/tracking.md" },
      { "Launching" = "api/launch.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant = "modern"
language = "en"
features = [
  "announce.dismiss",
  #"content.action.edit",
  #"content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

# [project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
