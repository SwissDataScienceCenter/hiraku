[project]
site_url = "https://swissdatasciencecenter.github.io/hiraku/"
site_name = "Hiraku"
site_description = "Core metadata and launch APIs for AI-assisted data science"
site_author = "Hiraku contributors"
copyright = "Hiraku · Swiss Data Science Center (SDSC)"
repo_url = "https://github.com/SwissDataScienceCenter/hiraku"
repo_name = "SwissDataScienceCenter/hiraku"
plugins = [
  "search",
  { "mkdocstrings" = { "handlers" = { "python" = { "paths" = ["src"], "options" = {
    "docstring_style" = "google",
    "members_order" = "alphabetical",
    "show_source" = false,
    "filters" = ["!^_"],
  } } } } },
]
docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:8000"

nav = [
  { "Get started" = [
      { "Overview" = "index.md" },
      # { "Examples" = "examples/" },
      # { "Examples" = [
      #   { "Heart Disease (CSV)" = "examples/heart-disease/README.md" },
      #   { "Iris (W&B)" = "examples/iris-wandb/README.md" },
      #   { "Digits (MLflow)" = "examples/digits-mlflow/README.md" },
      #   { "Kaparthy's Autoresearch" = "examples/autoresearch/README.md" },
      # ]},
      { "Essential Concepts" = "concepts.md" },
      # { "Examples" = "examples/#examples" },  # Reference link
  ] },
  { "Examples" = [
      { "Overview" = "examples/index.md" },
      { "Heart Disease (CSV)" = "examples/heart-disease/README.md" },
      { "Iris (W&B)" = "examples/iris-wandb/README.md" },
      { "Digits (MLflow)" = "examples/digits-mlflow/README.md" },
      { "EuroSAT RGB" = "examples/eurosat-rgb/README.md" },
      { "Kaparthy's Autoresearch" = "examples/autoresearch/README.md" },
      { "Workflow Examples" = "examples/workflow-examples/README.md" },
  ] },
  { "Guides" = [
      { "Overview" = "guides/index.md" },
      { "Start from scratch" = "examples/minimal/README.md" },
      { "Workflows" = "guides/workflows.md" },
      { "Tracking Backends" = [
        { "CSV" = "guides/tracking-csv.md" },
        { "W&B" = "guides/tracking-wandb.md" },
        { "MLflow" = "guides/tracking-mlflow.md" },
        { "Custom Backend" = "guides/tracking-custom.md"}
      ] },
      { "MCP server" = "guides/mcp.md" },
  ] },
  { "CLI" = "api/cli.md" },
  { "Python API" = [
      { "Overview" = "api/python/index.md" },
      { "Configuration" = "api/python/config.md" },
      { "Records" = "api/python/records.md" },
      { "Workflows" = "api/python/workflows.md" },
      { "Data models" = [
          { "Record" = "api/python/records.md" },
          { "Run" = "api/python/run.md" },
          { "Metric" = "api/python/metric.md" },
          { "Entrypoint" = "api/python/entrypoint.md" },
      ] },
      { "Tracking" = "api/python/tracking.md" },
      { "Launching" = "api/python/launch.md" },
      ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "javascripts/tablesort.js",
  { path = "javascripts/extra.js", async = true },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/sdsc-symbol-rgb.svg"
favicon = "assets/sdsc-symbol-rgb.svg"
custom_dir = "overrides"
features = [
  "header.autohide",
  "announce.dismiss",
  #"content.action.edit",
  #"content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.expand",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

[project.theme.font]
text = "Switzer"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
homepage = "https://datascience.ch"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SwissDataScienceCenter/hiraku"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
"mkdocs-click" = {}
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
