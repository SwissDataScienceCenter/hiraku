[project]
site_url = "https://swissdatasciencecenter.github.io/hiraku/"
site_name = "Hiraku"
site_description = "Core metadata and launch APIs for AI-assisted data science"
site_author = "Hiraku contributors"
copyright = "Hiraku · Swiss Data Science Center (SDSC)"
repo_url = "https://github.com/SwissDataScienceCenter/hiraku"
repo_name = "SwissDataScienceCenter/hiraku"
docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:8000"

nav = [
  { "Introduction" = [
      { "Hiraku" = "index.md" },
      { "Essential concepts" = "concepts.md" },
  ] },
  { "Getting started" = "getting_started.md" },
  { "User guide" = [
      { "Overview" = "guides/index.md" },
      { "Record code provenance" = "guides/experiment-branches.md" },
      { "Jobs and executors" = "guides/jobs.md" },
      { "Track and compare runs" = [
          { "Leaderboards" = "tracking.md" },
          { "CSV" = "guides/tracking-csv.md" },
          { "MLflow" = "guides/tracking-mlflow.md" },
          { "Weights & Biases" = "guides/tracking-wandb.md" },
          { "Dashboard" = "guides/dashboard.md" },
      ] },
      { "MCP server" = "guides/mcp.md" },
      { "Workflows" = "guides/workflows.md" },
  ] },
  { "Examples" = [
      { "Overview" = "examples/index.md" },
      { "Digits with MLflow" = "examples/digits-mlflow/README.md" },
      { "Workflows" = "examples/workflows/README.md" },
  ] },
  { "API reference" = [
      { "Overview" = "api/index.md" },
      { "Project" = "api/python/project.md" },
      { "Record" = "api/python/records.md" },
      { "Job" = "api/python/jobs.md" },
      { "Leaderboard" = "api/python/leaderboards.md" },
      { "Workflow" = "api/python/workflows.md" },
  ] },
  { "About" = [
      { "Authors" = "about/authors.md" },
      { "Contributing" = "about/contributing.md" },
      { "Changelog" = "about/changelog.md" },
      { "License" = "about/license.md" },
  ]},
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "javascripts/tablesort.js",
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/SDSC_01_primary_logo-color-RGB.svg"
favicon = "assets/SDSC_04_symbol-color-RGB.svg"
custom_dir = "overrides"
features = [
  "header.autohide",
  "announce.dismiss",
  #"content.action.edit",
  #"content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.expand",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

[project.theme.font]
text = "Switzer"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
homepage = "https://datascience.ch"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SwissDataScienceCenter/hiraku"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "."
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "alphabetical"
show_source = false
filters = ["!^_"]

[project.plugins.minify]
minify_html = true

[project.plugins.redirects.redirect_maps]
"api/cli.md" = "api/index.md"
"api/python/index.md" = "api/index.md"
"workflow.md" = "guides/workflows.md"
