repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-ast
    -   id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        types_or: [ python, pyproject ]
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        types_or: [ python, markdown ]
      - id: zensical-build
        name: docs build
        entry: uv run zensical build --clean
        language: system
        pass_filenames: false
        always_run: true
