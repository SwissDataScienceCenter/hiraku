name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v6.8.0

      - name: Verify tag version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${VERSION}" = "$GITHUB_REF_NAME"

      - name: Build distributions
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  build_package:
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          enable-cache: false
      - name: Build
        run: uv build
      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    needs:
      - build_package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hiraku
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          enable-cache: false
      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a
      - name: Publish
        run: uv publish

  publish-to-testpypi:
    needs:
      - build_package
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hiraku
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.7

      - name: Publish
        run: uv publish --publish-url https://test.pypi.org/legacy/
