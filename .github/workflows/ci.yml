name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra tui --extra heart-demo
      - name: Lint
        run: uv run --frozen ruff check src tests examples
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests examples
      - name: Test
        run: uv run --frozen pytest
      - name: Check CLI and TUI imports
        run: |
          uv run --frozen hiraku --help
          uv run --frozen python -c "import textual; import hiraku.tui"
      - name: Build package
        run: uv build
      - name: Smoke-test wheel installation
        run: uv run --isolated --no-project --with dist/*.whl hiraku --help
