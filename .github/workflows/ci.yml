name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required repository files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .github/settings.yml

      - name: Validate GitHub Actions workflows
        uses: rhysd/actionlint@v1

      - name: Validate branch protection settings
        run: |
          ruby <<'RUBY'
          require "yaml"

          settings = YAML.safe_load(File.read(".github/settings.yml"), aliases: true)
          rulesets = settings.fetch("rulesets")
          ruleset = rulesets.find { |entry| entry["name"] == "Protect main" }
          abort("missing Protect main ruleset") unless ruleset

          abort("default branch must be main") unless settings.dig("repository", "default_branch") == "main"
          abort("ruleset must target branches") unless ruleset["target"] == "branch"
          abort("ruleset must be active") unless ruleset["enforcement"] == "active"
          abort("ruleset must match the default branch") unless ruleset.dig("conditions", "ref_name", "include") == ["~DEFAULT_BRANCH"]

          rules = ruleset.fetch("rules")
          rule_types = rules.map { |rule| rule.fetch("type") }
          %w[deletion non_fast_forward pull_request required_status_checks].each do |type|
            abort("missing #{type} rule") unless rule_types.include?(type)
          end

          pull_request_rule = rules.find { |rule| rule["type"] == "pull_request" }.fetch("parameters")
          abort("expected one approving review") unless pull_request_rule["required_approving_review_count"] == 1
          abort("review threads must be resolved") unless pull_request_rule["required_review_thread_resolution"] == true

          status_checks_rule = rules.find { |rule| rule["type"] == "required_status_checks" }.fetch("parameters")
          abort("status checks must be strict") unless status_checks_rule["strict_required_status_checks_policy"] == true
          required_status_checks = status_checks_rule.fetch("required_status_checks")
          abort("required check must match the workflow job name") unless required_status_checks.any? { |check| check["context"] == "repository checks" }

          bypass_actors = ruleset.fetch("bypass_actors")
          abort("admin-only PR bypass must be configured") unless bypass_actors.any? { |actor| actor["actor_id"] == 5 && actor["actor_type"] == "RepositoryRole" && actor["bypass_mode"] == "pull_request" }
          RUBY
