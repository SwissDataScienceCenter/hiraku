name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra heart-demo
      - name: Lint
        run: uv run --frozen ruff check src tests examples
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests examples
      - name: Test
        run: uv run --frozen pytest
      - name: Build package
        run: uv build
      - name: Smoke-test wheel installation
        run: uv run --isolated --no-project --with dist/*.whl hiraku --help
