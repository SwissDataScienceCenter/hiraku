[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiraku"
version = "0.1.0"
description = "Core metadata and launch APIs for AI-assisted data science"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Click>=8.1",
    "pydantic>=2.13.5",
    "PyYAML>=6.0",
]

[project.scripts]
hiraku = "hiraku.cli:main"

[project.optional-dependencies]
mlflow = ["mlflow>=2.0"]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  "build>=1.2",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hiraku"]

[tool.hatch.build.targets.sdist]
include = ["src/hiraku", "tests", "README.md", "docs", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", "plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end integration tests"]
addopts = "-n auto --dist loadscope"