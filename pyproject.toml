[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hiraku"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Johannes Kirschner", email = "johannes.kirschner@sdsc.ethz.ch"},
    {name = "Matteo Fasulo", email = "matteo.fasulo@sdsc.ethz.ch"},
    {name = "Qianqian Zou", email = "qianqian.zou@epfl.ch"},
]
description = "Core metadata and launch APIs for AI-assisted data science"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Click>=8.1",
    "packaging>=24",
    "filelock>=3.16",
    "markdown-it-py>=4.0",
    "pydantic>=2.13.4",
    "PyYAML>=6.0",
    "mcp>=2.3.0",
    "rich>=15.0.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-frontmatter>=1.3.0",
    "psij-python>=0.9.11",
    "psutil>=7",
    "textual>=8.2.8",
]

[project.scripts]
hiraku = "hiraku.cli:main"

[project.entry-points."marimo_studio.view_provider"]
html = "hiraku.dashboard.provider:provider"

[project.optional-dependencies]
mlflow = ["mlflow-skinny==3.16.0"]
wandb = ["wandb>=0.29.0"]
dashboard = [
    "altair>=6.3.0",
    "marimo>=0.25.2,<0.26",
    "marimo-studio==0.4.1",
    "pandas>=2.2.2",
    "pyarrow>=21",
]

[dependency-groups]
test = [
  "mlflow==3.16.0",
  "tqdm>=4.70.0",
  "pytest>=8",
  "pytest-xdist>=3.8.0",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
]
lint = ["ruff>=0.8"]
docs = [
  "zensical>=0.0.59",
  "mkdocstrings[python]>=1.0.6",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
  "pre-commit>=4.0",
  "ty>=0.0.79",
]

[tool.hatch.build]
exclude = [".artifacts", ".locks", ".owners", "__marimo__", "__pycache__"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "examples"]

[tool.hatch.build.targets.wheel]
only-include = ["src/hiraku", "src/psij-descriptors", "examples"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"examples" = "hiraku/resources/examples"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -n auto --tb=no"
markers = ["integration: tests requiring external services or optional integrations"]
