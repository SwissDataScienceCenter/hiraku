[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiraku"
version = "0.1.0"
description = "A lightweight workflow and toolkit for AI-assisted data science research"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
heart-demo = [
  "pandas>=2.3.0",
  "scikit-learn>=1.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
hiraku = "hiraku.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hiraku"]

[tool.hatch.build]
include = [
  "src/hiraku/**/*.py",
  "src/hiraku/assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

