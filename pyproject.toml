[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "hiraku"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Johannes Kirschner", email = "johannes.kirschner@sdsc.ethz.ch"},
    {name = "Matteo Fasulo", email = "matteo.fasulo@sdsc.ethz.ch"},
    {name = "Qianqian Zou", email = "qianqian.zou@epfl.ch"},
]
description = "Core metadata and launch APIs for AI-assisted data science"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Click>=8.1",
    "pydantic>=2.13.5",
    "PyYAML>=6.0",
]

[project.scripts]
hiraku = "hiraku.cli:main"

[project.optional-dependencies]
mlflow = ["mlflow==3.16.0"]
wandb = ["wandb>=0.29.0"]
dashboard = [
    "altair>=6.3.0",
    "marimo>=0.25.1,<0.26",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
  "tqdm>=4.70.0",
  "pytest>=8",
  "pytest-xdist>=3.8.0",
  "pre-commit>=4.0",
  "ruff>=0.8",
  "build>=1.2",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
  "zensical>=0.0.59",
  "mkdocstrings[python]>=1.0.6",
  "mkdocs-click>=0.9.0",
  "ty>=0.0.79",
  "bump-my-version>=1.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hiraku"]

[tool.hatch.build.targets.sdist]
include = ["src/hiraku", "tests", "README.md", "docs", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end integration tests"]
addopts = "-n auto --dist loadscope"

[tool.bumpversion]
current_version = "0.1.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false

tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"

allow_dirty = false
commit = true
message = "chore(release): bump version {current_version} → {new_version}"
commit_args = ""

allow_shell_hooks = true

setup_hooks = [
    "uv run python scripts/check_changelog.py"
]

pre_commit_hooks = ["uv lock"]
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "hiraku"
version = "{current_version}"'''
replace = '''name = "hiraku"
version = "{new_version}"'''
