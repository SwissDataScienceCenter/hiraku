[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiraku"
version = "0.2.0"
description = "A toolkit for AI-assisted data science research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mlflow = ["mlflow>=3.0"]

[project.scripts]
hiraku = "hiraku.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hiraku"]

[tool.hatch.build]
include = [
  "src/hiraku/**/*.py",
  "src/hiraku/resources/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["examples/autoresearch/prepare.py", "examples/autoresearch/train.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
