[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiraku"
version = "0.1.0"
description = "Core metadata and launch APIs for AI-assisted data science"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/hiraku"]

[tool.hatch.build.targets.sdist]
include = ["src/hiraku", "tests", "README.md", "docs", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", "plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
